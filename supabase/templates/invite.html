<!doctype html>
<html lang="en">
  <body style="margin:0;background:#f3f5f7;color:#1f2933;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f5f7;padding:32px 12px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #dce2e8;">
          <tr><td align="center" style="padding:28px 28px 12px;">
            <img src="{{ .SiteURL }}/Logo.png" width="72" height="72" alt="Dobco Group" style="display:block;width:72px;height:72px;object-fit:contain;" />
            <p style="margin:12px 0 0;color:#16212b;font-size:14px;font-weight:bold;">SubTracker</p>
          </td></tr>
          <tr><td style="padding:8px 32px 32px;">
            <h1 style="margin:0 0 18px;text-align:center;color:#16212b;font-size:24px;line-height:1.3;">SubTracker User Invitation</h1>
            <p style="margin:0 0 22px;font-size:15px;line-height:1.6;">You have been invited to access SubTracker.</p>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 26px;border-collapse:collapse;">
              <tr><td style="padding:9px 0;border-bottom:1px solid #e7ebef;color:#697783;font-size:13px;">User Name</td><td style="padding:9px 0;border-bottom:1px solid #e7ebef;text-align:right;font-size:14px;font-weight:bold;">{{ .Data.name }}</td></tr>
              <tr><td style="padding:9px 0;border-bottom:1px solid #e7ebef;color:#697783;font-size:13px;">Email</td><td style="padding:9px 0;border-bottom:1px solid #e7ebef;text-align:right;font-size:14px;">{{ .Email }}</td></tr>
              <tr><td style="padding:9px 0;color:#697783;font-size:13px;">Assigned Role</td><td style="padding:9px 0;text-align:right;font-size:14px;font-weight:bold;">{{ .Data.role }}</td></tr>
            </table>
            <p style="margin:0 0 28px;text-align:center;">
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#152b3b;color:#ffffff;padding:13px 24px;text-decoration:none;font-size:14px;font-weight:bold;">Accept Invitation</a>
            </p>
            <p style="margin:0;text-align:center;color:#697783;font-size:12px;line-height:1.6;">Dobco Group<br />SubTracker Compliance Management</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
